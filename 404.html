<style>
:root{--ink:#0D0D0D;--paper:#FAFAF9;--sun:#E67E22;--dim:#525252;--border:rgba(0,0,0,.06)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif}
.box{max-width:680px;text-align:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:32px 24px;box-shadow:0 2px 12px rgba(0,0,0,0.04)}
h1{font-family:'Fraunces',serif;font-size:clamp(1.9rem,5vw,3rem);margin:0 0 10px;letter-spacing:-0.02em}
p{color:var(--dim);font-size:1.05rem}
.fact{margin:16px 0 24px;color:var(--sun);font-weight:700}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:6px;text-decoration:none;font-weight:700;transition:all .2s}
.btn-main{background:var(--sun);color:#fff}
.btn-main:hover{background:var(--ink)}
.btn-alt{border:1px solid var(--border);color:var(--ink)}
.btn-alt:hover{border-color:var(--sun);color:var(--sun)}
</style>
</head>
<body>
  <main class="box">
    <h1>Oops! This page doesn't exist.</h1>

    <div class="actions">
      <a class="btn btn-main" href="sms-detective-game.html">Play SMS Detective</a>
      <a class="btn btn-alt" href="index.html">Go Home</a>
    </div>
  </main>
</body>
</html>
